<div class="container-fluid p-0 layout">
    <div class="overlay" *ngIf="isOpen" (click)="isOpen = !isOpen" ></div>
    <app-sidebar [isOpen]="isOpen"></app-sidebar>
    <div class="content" [ngClass]="{'expand': !isOpen}">
        <app-header (toggleMenuVisibility)="toggleSidebar($event)" [sidebarOpen]="isOpen" ></app-header>
        <router-outlet></router-outlet>
    </div>
</div>
